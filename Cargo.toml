[package]
name = "cobertuira"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.2"
tokio = { version = "1.36", features = ["full"] }
walkdir = "2.4"
anyhow = "1.0"
itertools = "0.12"
